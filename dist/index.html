<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><meta name="theme-color" content="#342720"><title>튼튼바퀴! 식품구성자전거</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app-shell" class="portrait"><header id="toolbar"><span>튼튼바퀴! 식품구성자전거</span><button id="fullscreen" aria-label="전체화면으로 가로 플레이">⛶ 전체화면</button></header><main id="game" aria-label="튼튼바퀴 식품구성자전거 게임">
<canvas id="world" width="1280" height="720" aria-label="위아래 드래그하거나 방향키로 앞바퀴를 음식의 그림자에 맞추세요"></canvas>
<div id="hud"><div class="topbar wood"><div class="timer"><span class="clock">◷</span><div><small>남은 시간</small><strong id="time">01:00</strong></div></div><div class="journey"><div class="journey-label"><span>출발</span><span id="distance">골인까지 1,100</span><span>골인 ⚑</span></div><div class="progress"><i id="progress"></i><span id="racer">🚴</span></div></div><button id="pause" class="square" aria-label="일시정지">Ⅱ</button><button id="sound" class="square" aria-label="소리 끄기">♪</button></div><div id="gauges" class="wood"></div><div id="hint" role="status">여러 식품을 골고루!</div></div>
<div class="track-caption"><span>위아래 드래그 ↕</span><span>G O O D &nbsp; F O O D · G O O D &nbsp; R I D E</span></div>
<div id="overlay" class="overlay"><section id="card" class="card wood"></section></div>
<div id="ending" hidden><img id="endingImage" alt=""><div class="ending-label"><small>HIGH SPEED FINISH</small><strong id="endingText">전력 질주!</strong></div><button id="skip" class="minor">건너뛰기 ›</button></div>
<div id="loadError" hidden></div>
</main><div id="viewNotice" role="status" hidden></div></div><script type="module" src="app.js"></script></body></html>
